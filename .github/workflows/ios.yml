name: MetapiM iOS unsigned
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform
        run: |
          flutter create --platforms=ios --org com.zzxan --project-name metapi_m .
          # flutter create supplies a counter-app test unrelated to this app.
          rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Configure native widget
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure_ios.rb
          cd ios
          pod install
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA and ZIP
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app/PlugIns/MetapiMWidget.appex
          mkdir -p output/Payload
          cp -R build/ios/iphoneos/Runner.app output/Payload/MetapiM.app
          cd output
          /usr/bin/zip -qry MetapiM-unsigned.ipa Payload
          shasum -a 256 MetapiM-unsigned.ipa > SHA256SUMS
          /usr/bin/zip -q MetapiM-iOS-unsigned.zip MetapiM-unsigned.ipa SHA256SUMS
          unzip -t MetapiM-unsigned.ipa
          unzip -t MetapiM-iOS-unsigned.zip
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MetapiM-iOS-unsigned
          path: output/*
          if-no-files-found: error

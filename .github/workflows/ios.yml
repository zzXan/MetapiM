name: MetapiM iOS unsigned
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform
        run: |
          flutter create --platforms=ios --org com.zzxan --project-name metapi_m .
          # flutter create supplies a counter-app test unrelated to this app.
          rm -f test/widget_test.dart
      - name: Configure Metapi logo
        run: |
          python3 -m pip install --break-system-packages cairosvg pillow
          python3 scripts/configure_icon.py
      - name: Dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Configure native widget
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure_ios.rb
          cd ios
          pod install
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app/PlugIns/MetapiMWidget.appex
          python3 scripts/validate_bundle.py build/ios/iphoneos/Runner.app
          rm -rf output
          mkdir -p output/Payload
          cp -R build/ios/iphoneos/Runner.app output/Payload/MetapiM.app
          cd output
          /usr/bin/zip -qry MetapiM-unsigned.ipa Payload
          unzip -t MetapiM-unsigned.ipa
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MetapiM-iOS-unsigned
          path: output/MetapiM-unsigned.ipa
          if-no-files-found: error
